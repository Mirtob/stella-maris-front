# Chequeo de tipos y pruebas unitarias en cada push.
#
# Por qué existe: el proyecto tenía `tsconfig.json` en modo `strict` desde el principio,
# pero NUNCA tuvo instalado el compilador — `npm run build` era solo esbuild, que borra
# los tipos sin comprobarlos. Al encenderlo aparecieron 149 errores acumulados, uno de
# ellos un `ReferenceError` que reventaba al borrar un cantoral del historial.
#
# `npm run build` ya corre `tsc --noEmit` antes de empaquetar, así que un error de tipos
# tumba también el despliegue de Vercel. Esto de aquí lo repite en GitHub para que se
# vea el fallo en el propio push, sin tener que ir a mirar a Vercel.

name: Tipos y pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 (LTS), como el resto del proyecto.
          node-version: '22'
          cache: npm

      # `npm install`, NO `npm ci`, y esto tiene una razón concreta.
      #
      # Con `npm ci` el chequeo de tipos fallaba aquí diciendo que no encontraba
      # @types/node ni @vercel/node, estando los dos en package.json y en el candado.
      # El MISMO chequeo, sobre el MISMO commit y también en Linux, pasa en Vercel — que
      # instala con `npm install`. Y en un clon limpio con `npm ci` pasa igualmente.
      #
      # No llegué a la causa de fondo. Se usa `npm install` porque es exactamente lo que
      # hace el entorno que de verdad importa (el que compila y despliega), y porque una
      # red de seguridad que no corre no protege de nada. Si algún día se quiere volver a
      # `npm ci`, hay que resolver antes ese misterio.
      - name: Instalar dependencias
        id: instalar
        continue-on-error: true
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/npm.log

      # El registro completo de una ejecución solo se lee con sesión iniciada. Las
      # ANOTACIONES, en cambio, son públicas: si la instalación falla, su error se
      # publica como anotación y se puede diagnosticar desde fuera.
      - name: Publicar el error de instalación
        if: steps.instalar.outcome == 'failure'
        run: |
          resumen=$(tail -c 900 /tmp/npm.log | tr -d '\r' | tr '\n' ' ')
          echo "::error::La instalación falló: $resumen"
          exit 1

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:unit
