# Chequeo de tipos y pruebas unitarias en cada push.
#
# Por qué existe: el proyecto tenía `tsconfig.json` en modo `strict` desde el principio,
# pero NUNCA tuvo instalado el compilador — `npm run build` era solo esbuild, que borra
# los tipos sin comprobarlos. Al encenderlo aparecieron 149 errores acumulados, uno de
# ellos un `ReferenceError` que reventaba al borrar un cantoral del historial.
#
# `npm run build` ya corre `tsc --noEmit` antes de empaquetar, así que un error de tipos
# tumba también el despliegue de Vercel. Esto de aquí lo repite en GitHub para que se
# vea el fallo en el propio push, sin tener que ir a mirar a Vercel.

name: Tipos y pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 (LTS). Con '20' el chequeo empezó a fallar de golpe en `npm ci`,
          # sin ningún cambio en el código ni en el candado — coincidiendo con el aviso
          # del runner de que Node 20 está obsoleto y las acciones se fuerzan a 24.
          node-version: '22'
          cache: npm
      # El registro completo de una ejecución solo se lee con sesión iniciada. Las
      # ANOTACIONES, en cambio, son públicas: si `npm ci` falla, su error se publica
      # como anotación para poder diagnosticarlo desde fuera.
      - name: Instalar dependencias
        id: instalar
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
      - name: Publicar el error de instalación
        if: steps.instalar.outcome == 'failure'
        run: |
          echo "::error::npm ci falló — $(tail -c 900 /tmp/npm-ci.log | tr '
' ' ' | tr -s ' ')"
          exit 1
      - name: Chequeo de tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm run test:unit
