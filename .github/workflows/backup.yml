name: Backup diario de Supabase

on:
  schedule:
    # 03:00 UTC = 00:00 Chile (UTC-3)
    - cron: '0 3 * * *'
  workflow_dispatch: {} # Permitir trigger manual desde el dashboard

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `gh release create`/`delete` necesita escribir Releases y tags. Sin esto, con el
    # GITHUB_TOKEN restringido (default actual de GitHub) el paso falla con HTTP 403.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-backup.mjs

      - name: Comprimir y encriptar
        env:
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PASSPHRASE" ]; then
            echo "❌ Falta el secret BACKUP_GPG_PASSPHRASE — no se puede encriptar el backup"
            exit 1
          fi
          # Tomar el archivo backup-*.json más reciente
          BACKUP_FILE=$(ls -t backup-*.json | head -1)
          echo "Backup file: $BACKUP_FILE"

          # Comprimir
          gzip -9 "$BACKUP_FILE"

          # Encriptar con GPG simétrico
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "${BACKUP_FILE}.gz.gpg" \
            "${BACKUP_FILE}.gz"

          # Limpiar el plain
          rm "${BACKUP_FILE}.gz"

          echo "ENCRYPTED_FILE=${BACKUP_FILE}.gz.gpg" >> $GITHUB_ENV

      - name: Crear release con el backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(date +%Y-%m-%d-%H%M)"
          gh release create "$TAG" "$ENCRYPTED_FILE" \
            --title "Backup $TAG" \
            --notes "Backup automático encriptado. Para restore ver docs/BACKUP-SETUP.md" \
            --prerelease

      - name: Limpiar releases viejos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mantener solo los últimos 30 backups (cron diario = ~30 días)
          gh release list --limit 100 --json tagName,createdAt \
            | jq -r '.[] | select(.tagName | startswith("backup-")) | .tagName' \
            | tail -n +31 \
            | xargs -I {} gh release delete {} --yes --cleanup-tag || true
